  - name: Platform Engineering User Group
    dir: platform-engineering
    mission_statement: >
      The CNCF Platform Engineering User Group brings together practitioners,
      platform consumers, developers, maintainers, and providers to share
      knowledge and advance the practice of building and operating cloud native
      platforms.
