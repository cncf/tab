      slack_channel: ug-public-sector
  - name: Telecom User Group
    dir: telecom
    mission_statement: >
      The CNCF Telecom User Group represents the architectural and operational
      requirements of telecom networks and cloud native telecom applications.
      It connects telecom industry needs with CNCF projects, including needs
      related to multi-networking, configuration management, and lifecycle
      management across distributed edge locations.
    charter_link: "https://docs.google.com/document/d/1tadJTme4JeT-cIYpD3dGiXqtV9BdSeVWpbPYMbEHhyo/edit?usp=sharing"
