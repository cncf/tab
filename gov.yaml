tab:
  - name: End User Technical Advisory Board
    dir: "/"
    mission_statement: >
      The CNCF End User Technical Advisory Board (TAB) acts as a vital voice of
      end users within the CNCF community. It plays a key role in advancing topics
      of concern to end users, enhancing visibility into end user adoption of CNCF
      projects, and raising awareness about the needs and perspectives of end users
      in the cloud native ecosystem.
