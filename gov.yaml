user_groups:
  - name: Public Sector User Group
    dir: public-sector
    mission_statement: >
      The CNCF Public Sector User Group aims to serve as a hub for discussing and
      advancing cloud computing within the public sector, utilizing cloud native
      technologies. This includes enumerating current practices and identifying
      gaps. The group also directs efforts to improve public sector workflows
      relevant to the cloud computing ecosystem.
    charter_link: "https://github.com/cncf/public-sector-user-group/blob/main/charter.md"
