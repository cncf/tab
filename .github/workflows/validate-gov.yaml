name: Validate governance data

on:
  pull_request:
    paths:
      - gov.yaml

permissions:
  contents: read

jobs:
  generate:
    name: Validate generated governance files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: generator/go.mod

      - name: Generate governance files
        working-directory: generator
        run: go run .

      - name: Collect generated README changes
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git add -- README.md 'user-groups/**/README.md'
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          paths = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only", "-z"]
          ).decode().split("\0")
          files = {path: pathlib.Path(path).read_text() for path in paths if path}
          artifact = pathlib.Path(os.environ["RUNNER_TEMP"]) / "generated-readmes.json"
          artifact.write_text(json.dumps({
              "pull_request": int(os.environ["PR_NUMBER"]),
              "files": files,
          }))
          PY

      - name: Upload generated README changes
        uses: actions/upload-artifact@v4
        with:
          name: generated-governance-readmes
          path: ${{ runner.temp }}/generated-readmes.json
          if-no-files-found: error
